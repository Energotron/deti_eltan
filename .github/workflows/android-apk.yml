name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile_godot/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Godot 4.3 and Android export templates
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v4.3-stable_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          curl -fsSL -o /tmp/templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Godot Android toolchain
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Validate Godot project
        working-directory: mobile_godot
        run: godot --headless --editor --quit

      - name: Export Android debug APK
        working-directory: mobile_godot
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/deti_eltan_mobile_debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deti-eltan-mobile-debug
          path: mobile_godot/build/deti_eltan_mobile_debug.apk
          if-no-files-found: error
